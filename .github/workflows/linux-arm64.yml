name: Linux ARM64 Installer
run-name: ${{ inputs.cura_conan_version }} ARM64 by @${{ github.actor }}

on:
  push:
  pull_request:
    branches:
      - main
      - '[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      cura_conan_version:
        description: 'Cura Conan Version'
        default: 'cura/latest@ultimaker/testing'
        type: string
      package_overrides:
        description: 'List of specific packages to be used (space-separated)'
        default: ''
        type: string
      conan_args:
        description: 'Conan args'
        default: ''
        required: false
        type: string
      enterprise:
        description: 'Build Cura as an Enterprise edition'
        default: false
        required: true
        type: boolean
      staging:
        description: 'Use staging API'
        default: false
        required: true
        type: boolean

env:
  CONAN_LOGIN_USERNAME: ${{ secrets.CONAN_USER }}
  CONAN_PASSWORD: ${{ secrets.CONAN_PASS }}
  # Pin versions to avoid conflicts
  CURA_VERSION: ${{ inputs.cura_conan_version || '5.12.0-alpha.0' }}
  # Version overrides to resolve dependency conflicts
  # Format: --require-override="pkg/version" for each conflict
  # dulcificum/5.10.0 wants spdlog/1.12.0, curaengine wants spdlog/1.15.1
  VERSION_OVERRIDES: >-
    --require-override="spdlog/1.15.1"

jobs:
  linux-installer-arm64:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'arm64'

      # ============================================================
      # STEP 1: Install ONLY essential system build dependencies
      # DO NOT install Qt system packages - let Conan manage Qt
      # This prevents system vs Conan Qt version conflicts
      # ============================================================
      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -yq \
            build-essential \
            cmake \
            ninja-build \
            git \
            gettext \
            pkg-config \
            autoconf \
            automake \
            libtool \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libegl1-mesa-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-cursor-dev \
            libxcb-glx0-dev \
            libxcb-icccm4-dev \
            libxcb-image0-dev \
            libxcb-keysyms1-dev \
            libxcb-randr0-dev \
            libxcb-render-util0-dev \
            libxcb-shape0-dev \
            libxcb-shm0-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libxcb-xinerama0-dev \
            libxcb-xkb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrender-dev \
            libxi-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxinerama-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libssl-dev \
            libnsl-dev \
            libtirpc-dev \
            libdbus-1-dev \
            libatspi2.0-dev \
            libdrm-dev \
            libgbm-dev \
            libinput-dev \
            libudev-dev \
            libmtdev-dev \
            libevdev-dev \
            libwayland-dev \
            libwayland-egl1 \
            patchelf

      # ============================================================
      # STEP 2: Setup Conan FIRST with correct profile order
      # ============================================================
      - name: Install Conan
        run: |
          pip install conan==2.7.1 --break-system-packages
          echo "Conan version: $(conan --version)"

      - name: Install Conan dependencies
        run: |
          pip install gitpython pyyaml jinja2 requests --break-system-packages

      # CRITICAL: Install Cura config FIRST, then detect profile
      # The cura.jinja profile includes(default), so default must exist
      - name: Configure Conan profiles
        run: |
          # Step 1: Detect default profile (creates ~/.conan2/profiles/default)
          conan profile detect --force
          
          # Step 2: Install Cura config (adds cura.jinja and sets it as default)
          conan config install https://github.com/Ultimaker/conan-config.git
          
          # Step 3: Verify the ARM64 profile is correct
          echo "=== Default profile contents ==="
          conan profile show -pr:h default
          
          # Step 4: Add ARM64-specific options to the default profile
          # NOTE: Only add [options] section - [settings] already exists with correct arch=armv8
          cat >> ~/.conan2/profiles/default << 'EOF'

          [options]
          # Ensure boost is header-only to avoid binary conflicts
          boost/*:header_only=True
          # Use system OpenSSL to avoid version conflicts  
          openssl/*:shared=True
          EOF
          
          echo "=== Updated profile ==="
          conan profile show

      # ============================================================
      # STEP 3: Configure remotes with proper priority
      # Keep ConanCenter as fallback but prioritize cura-conan2
      # ============================================================
      - name: Configure Conan remotes
        run: |
          # List current remotes
          echo "=== Current remotes ==="
          conan remote list
          
          # Ensure cura remote has highest priority (index 0)
          # Don't disable conancenter - some transitive deps need it
          conan remote update cura-conan2 --index 0 || true
          
          # If you have credentials, authenticate
          if [ -n "$CONAN_LOGIN_USERNAME" ]; then
            conan remote login cura-conan2 "$CONAN_LOGIN_USERNAME" -p "$CONAN_PASSWORD" || true
          fi
          
          echo "=== Final remote order ==="
          conan remote list

      # ============================================================
      # STEP 4: Handle package overrides if specified
      # ============================================================
      - name: Apply package overrides
        if: ${{ inputs.package_overrides != '' }}
        run: |
          # Create a profile with package version overrides
          echo "[tool_requires]" >> ~/.conan2/profiles/default
          for pkg in ${{ inputs.package_overrides }}; do
            echo "$pkg" >> ~/.conan2/profiles/default
          done
          echo "=== Profile with overrides ==="
          conan profile show

      # ============================================================
      # STEP 5: Analyze dependency graph (diagnostic)
      # ============================================================
      - name: Analyze dependency graph
        run: |
          echo "=== Analyzing dependency graph for potential conflicts ==="
          # This helps identify version conflicts before the long build
          conan graph info . \
            $VERSION_OVERRIDES \
            -c tools.system.package_manager:mode=install \
            -c tools.system.package_manager:sudo=True \
            ${{ inputs.conan_args }} 2>&1 | tee graph_info.txt || true
          
          # Check for any conflict warnings
          if grep -i "conflict" graph_info.txt; then
            echo "⚠️  Potential conflicts detected - check VERSION_OVERRIDES in workflow"
          else
            echo "✅ No obvious conflicts in dependency graph"
          fi

      # ============================================================
      # STEP 6: Generate lockfile to resolve all versions
      # This catches version conflicts BEFORE the long build
      # ============================================================
      - name: Generate dependency lockfile
        run: |
          echo "Generating lockfile to resolve all dependency versions..."
          echo "Using version overrides: $VERSION_OVERRIDES"
          
          # Handle known version conflicts with overrides (defined in env.VERSION_OVERRIDES)
          # dulcificum/5.10.0 requires spdlog/1.12.0 but curaengine needs 1.15.1
          # Force the newer version (1.15.1) as it's usually backward compatible
          
          conan lock create . \
            --lockfile-out=conan.lock \
            --build=missing \
            $VERSION_OVERRIDES \
            -c tools.system.package_manager:mode=install \
            -c tools.system.package_manager:sudo=True \
            ${{ inputs.conan_args }}
          
          echo "=== Lockfile generated ==="
          cat conan.lock | head -100

      # ============================================================
      # STEP 7: Install dependencies using lockfile
      # ============================================================
      - name: Install Cura dependencies
        run: |
          conan install . \
            --lockfile=conan.lock \
            --output-folder=build \
            --build=missing \
            $VERSION_OVERRIDES \
            -c tools.system.package_manager:mode=install \
            -c tools.system.package_manager:sudo=True \
            ${{ inputs.conan_args }}
        timeout-minutes: 180

      # ============================================================
      # STEP 8: Build Cura
      # ============================================================
      - name: Build Cura
        run: |
          cd build
          source conanbuild.sh
          cmake .. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=conan_toolchain.cmake
          cmake --build . --parallel
        timeout-minutes: 60

      # ============================================================
      # STEP 9: Create Conan package
      # ============================================================
      - name: Create Cura package
        run: |
          conan create . \
            --lockfile=conan.lock \
            --version="${{ env.CURA_VERSION }}" \
            --build=missing \
            $VERSION_OVERRIDES \
            -c tools.system.package_manager:mode=install \
            -c tools.system.package_manager:sudo=True \
            -o cura/*:enterprise=${{ inputs.enterprise || 'False' }} \
            -o cura/*:staging=${{ inputs.staging || 'False' }} \
            ${{ inputs.conan_args }}

      # ============================================================
      # STEP 10: Setup AppImage build
      # ============================================================
      - name: Install AppImage dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -yq \
            file fuse libfuse2 squashfs-tools zsync desktop-file-utils
          pip install pyinstaller jinja2 --break-system-packages

      - name: Deploy Cura for PyInstaller
        run: |
          mkdir -p appimage_build
          cd appimage_build
          
          # Deploy with the same lockfile for consistency
          conan install --requires="cura/${{ env.CURA_VERSION }}" \
            --deployer=full_deploy \
            --deployer-folder=. \
            --build=missing \
            -c tools.system.package_manager:mode=install \
            -c tools.system.package_manager:sudo=True \
            -g VirtualRunEnv
          
          # Source the environment
          source conanrun.sh

      - name: Run PyInstaller
        run: |
          cd appimage_build
          source conanrun.sh
          
          # Find and use the spec file
          SPEC_FILE=$(find . -name "UltiMaker-Cura.spec" | head -1)
          if [ -z "$SPEC_FILE" ]; then
            echo "ERROR: Could not find UltiMaker-Cura.spec"
            find . -name "*.spec" -type f
            exit 1
          fi
          
          pyinstaller "$SPEC_FILE" --noconfirm

      - name: Download appimagetool
        run: |
          cd appimage_build/dist
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-aarch64.AppImage
          chmod +x appimagetool-aarch64.AppImage
          # Extract because FUSE might not work in CI
          ./appimagetool-aarch64.AppImage --appimage-extract
          mv squashfs-root appimagetool-extracted

      - name: Create AppImage
        run: |
          cd appimage_build/dist
          export APPIMAGETOOL_LOCATION="${PWD}/appimagetool-extracted/AppRun"
          
          # Make appimagetool executable
          chmod +x "${APPIMAGETOOL_LOCATION}"
          
          python3 ../../packaging/AppImage/create_appimage.py \
            UltiMaker-Cura \
            "${{ env.CURA_VERSION }}" \
            "UltiMaker-Cura-${{ env.CURA_VERSION }}-Linux-ARM64.AppImage"

      - name: Verify AppImage
        run: |
          cd appimage_build/dist
          APPIMAGE="UltiMaker-Cura-${{ env.CURA_VERSION }}-Linux-ARM64.AppImage"
          
          if [ -f "$APPIMAGE" ]; then
            ls -lh "$APPIMAGE"
            file "$APPIMAGE"
            echo "✅ AppImage created successfully!"
          else
            echo "❌ AppImage was not created"
            echo "Available files:"
            ls -la
            exit 1
          fi

      # ============================================================
      # STEP 11: Upload artifacts
      # ============================================================
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cura-linux-arm64-build-${{ env.CURA_VERSION }}-${{ github.sha }}
          path: |
            build/
            conan.lock
          retention-days: 7

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: UltiMaker-Cura-${{ env.CURA_VERSION }}-Linux-ARM64-AppImage
          path: appimage_build/dist/UltiMaker-Cura-*.AppImage
          if-no-files-found: error
          retention-days: 30

      - name: Upload AppImage to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: appimage_build/dist/UltiMaker-Cura-*.AppImage
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
