name: Linux ARM64 Installer

on:
  push:
  workflow_dispatch:
    inputs:
      cura_conan_version:
        description: 'Cura Conan Version'
        default: ''
        type: string
      package_overrides:
        description: 'List of specific packages to be used (space-separated)'
        default: ''
        type: string
      conan_args:
        description: 'Conan args'
        default: ''
        required: false
        type: string
      enterprise:
        description: 'Build Cura as an Enterprise edition'
        default: false
        required: true
        type: boolean
      staging:
        description: 'Use staging API'
        default: false
        required: true
        type: boolean
      use_self_hosted:
        description: 'Use self-hosted ARM64 runner'
        default: false
        required: true
        type: boolean

jobs:
  linux-arm64-installer:
    runs-on: ${{ inputs.use_self_hosted && 'self-hosted-linux-arm64' || 'ubuntu-24.04-arm' }}

    steps:
      - name: Checkout Cura
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt6 and system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-declarative-dev \
            qt6-tools-dev \
            libgl1-mesa-dev \
            python3 \
            python3-pip \
            python3-venv \
            git \
            wget \
            curl \
            patchelf \
            cmake \
            ninja-build \
            ccache \
            autoconf \
            automake \
            libtool

      - name: Install Conan
        run: |
          pip3 install --break-system-packages "conan>=2.7.0,<3.0.0"

      - name: Configure Conan profile for ARM64
        run: |
          conan config install https://github.com/ultimaker/conan-config.git
          conan profile detect --force

          # Create a cura-arm64 profile that extends default with cura-specific settings
          cat > ~/.conan2/profiles/cura-arm64 << 'EOF'
          include(default)

          [replace_requires]
          libsystemd/*: libsystemd/[>=255.10]
          fmt/*: fmt/[>=11.0.0]
          boost/*: boost/[>=1.86.0]
          spdlog/*: spdlog/[>=1.15.0]

          [settings]
          compiler.cppstd=17
          curaengine*:compiler.cppstd=20
          curaengine_plugin_infill_generate*:compiler.cppstd=20
          curaengine_plugin_gradual_flow*:compiler.cppstd=20
          curaengine_grpc_definitions*:compiler.cppstd=20
          scripta*:compiler.cppstd=20
          umspatial*:compiler.cppstd=20
          dulcificum*:compiler.cppstd=20
          uvula*:compiler.cppstd=20
          curator/*:compiler.cppstd=20
          arcus*:compiler.cppstd=20
          pyarcus*:compiler.cppstd=20

          [options]
          asio-grpc/*:local_allocator=recycling_allocator
          grpc/*:csharp_plugin=False
          grpc/*:node_plugin=False
          grpc/*:objective_c_plugin=False
          grpc/*:php_plugin=False
          grpc/*:ruby_plugin=False
          grpc/*:python_plugin=False
          boost/*:header_only=True
          openssl/*:shared=True
          pyarcus/*:shared=True
          pysavitar/*:shared=True
          pynest2d/*:shared=True
          cpython/*:shared=True
          cpython/*:with_tkinter=False
          cpython/*:with_curses=False
          dulcificum/*:shared=True
          clipper/*:shared=True
          EOF

          echo "Created cura-arm64 profile"
          conan profile show

      - name: Fix Conan 2.0 compatibility issues in cached recipes
        run: |
          # This script patches AutoPackager usage in conan recipes that are not yet Conan 2.0 compatible
          # The patches are applied to the conan cache after recipes are downloaded

          mkdir -p ~/.conan2/extensions/commands
          cat > ~/.conan2/extensions/commands/patch_autopackager.py << 'EOF'
          from conan.api.conan_api import ConanAPI
          from conan.cli.command import conan_command
          import os
          import re

          def patch_autopackager_in_cache(conan_api: ConanAPI):
              """Patch AutoPackager usage in conan cache recipes"""
              import glob
              import logging

              logger = logging.getLogger(__name__)
              cache_path = os.path.expanduser("~/.conan2/p")

              # Find all conanfile.py files in cache
              for filepath in glob.glob(os.path.join(cache_path, "*", "*", "e", "conanfile.py"), recursive=True):
                  try:
                      with open(filepath, 'r') as f:
                          content = f.read()

                      # Check if file uses AutoPackager
                      if 'AutoPackager' in content:
                          logger.info(f"Patching AutoPackager in {filepath}")

                          # Replace AutoPackager import and usage
                          content = content.replace(
                              'from conan.tools.files import copy, save, load, AutoPackager',
                              'from conan.tools.files import copy, save, load'
                          )

                          # Replace AutoPackager(self).run() with explicit copy calls
                          if 'AutoPackager(self).run()' in content:
                              replacement = '''copy(self, pattern="*.h", dst=os.path.join(self.package_folder, "include"), keep_path=False)
          copy(self, pattern="*.a", dst=os.path.join(self.package_folder, "lib"), keep_path=False)
          copy(self, pattern="*.lib", dst=os.path.join(self.package_folder, "lib"), keep_path=False)
          copy(self, pattern="*.so*", dst=os.path.join(self.package_folder, "lib"), keep_path=False)
          copy(self, pattern="*.dylib", dst=os.path.join(self.package_folder, "lib"), keep_path=False)
          copy(self, pattern="*.dll", dst=os.path.join(self.package_folder, "bin"), keep_path=False)'''
                              content = content.replace('AutoPackager(self).run()', replacement)

                          with open(filepath, 'w') as f:
                              f.write(content)
                          logger.info(f"Patched {filepath}")
                  except Exception as e:
                      logger.warning(f"Failed to patch {filepath}: {e}")

              logger.info("AutoPackager patching complete")

          @conan_command(group="Custom commands")
          def patch_autopackager(*args, **kwargs):
              """Patch AutoPackager usage in conan cache for Conan 2.0 compatibility"""
              conan_api = ConanAPI()
              patch_autopackager_in_cache(conan_api)
          EOF

      - name: Create libnsl symlink for ARM64
        run: |
          # Some Python builds may need libnsl.so symlink
          if [ -f /lib/aarch64-linux-gnu/libnsl.so.2 ] && [ ! -L /lib/aarch64-linux-gnu/libnsl.so ]; then
            sudo ln -sf /lib/aarch64-linux-gnu/libnsl.so.2 /lib/aarch64-linux-gnu/libnsl.so
          fi

      - name: Install Cura dependencies with Conan
        run: |
          cd /home/runner/work/Cura/Cura

          # Set CONAN_LOGIN_USERNAME to skip any interactive prompts
          export CONAN_LOGIN_USERNAME=""

          # Run conan install with cura-arm64 profile
          conan install . \
            --build=missing \
            --update \
            -o cura/*:devtools=True \
            -pr:h cura-arm64 \
            -pr:b default \
            -g VirtualPythonEnv \
            ${{ inputs.conan_args }}

      - name: Build Cura
        run: |
          cd /home/runner/work/Cura/Cura
          source venv/bin/activate

          # Verify PyQt6 is installed
          python -c "import PyQt6; print('PyQt6 installed successfully')"

          # Run any additional build steps if needed
          # python cura_app.py --version  # Quick sanity check

      - name: Create PyInstaller spec
        run: |
          cd /home/runner/work/Cura/Cura
          source venv/bin/activate

          # Run conan deploy to prepare for PyInstaller
          conan deploy . || true

          # The spec file should have been generated by conan deploy
          if [ -f "venv/conan/UltiMaker-Cura.spec" ]; then
            echo "PyInstaller spec found at venv/conan/UltiMaker-Cura.spec"
          else
            echo "Warning: PyInstaller spec not found"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cura-arm64-build
          path: |
            venv/
            dist/
          retention-days: 7
