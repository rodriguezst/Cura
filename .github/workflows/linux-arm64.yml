name: Linux ARM64 Installer
run-name: ${{ inputs.cura_conan_version }} ARM64 by @${{ github.actor }}

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      cura_conan_version:
        description: 'Cura Conan Version'
        default: ''
        type: string
      package_overrides:
        description: 'List of specific packages to be used (space-separated)'
        default: ''
        type: string
      conan_args:
        description: 'Conan args'
        default: ''
        required: false
        type: string
      enterprise:
        description: 'Build Cura as an Enterprise edition'
        default: false
        required: true
        type: boolean
      staging:
        description: 'Use staging API'
        default: false
        required: true
        type: boolean

jobs:
  linux-installer-arm64:
    runs-on: ubuntu-24.04-arm  # Use ARM64 runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'arm64'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo DEBIAN_FRONTEND=noninteractive apt install -yq \
            python3-pip python3-venv python3-dev python3-full pipx \
            cmake git build-essential ninja-build gettext \
            qt6-base-dev qt6-declarative-dev libqt6svg6-dev \
            libgl1-mesa-dev libglu1-mesa-dev pkg-config \
            libx11-dev libxcb1-dev libxkbcommon-dev \
            python3-git python3-yaml python3-jinja2 python3-requests \
            libxcb-cursor-dev libxcb-icccm4-dev libxcb-image0-dev \
            libxcb-keysyms1-dev libxcb-randr0-dev libxcb-render-util0-dev \
            libxcb-shape0-dev libxcb-sync-dev libxcb-xfixes0-dev libxcb-xinerama0-dev \
            libnsl-dev libtirpc-dev

      - name: Install SIP, PyQt6 and setup qmake
        run: |
          python3 -m pip install --break-system-packages "sip>=6,<7"
          python3 -m pip install --break-system-packages --only-binary :all: PyQt6>=6.8.0
          sudo ln -sf /usr/bin/qmake6 /usr/bin/qmake || true

      - name: Install Conan
        run: |
          pipx install conan==2.7.1
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Inject Conan dependencies
        run: |
          pipx inject conan gitpython pyyaml jinja2 requests

      - name: Configure Conan
        run: |
          conan config install https://github.com/Ultimaker/conan-config.git
          conan profile detect --force

      - name: Configure Conan remotes to prevent version conflicts
        run: |
          # Prioritize cura-conan2 over ConanCenter to prevent version conflicts
          # When a package exists in both remotes, use the cura-conan2 version
          # This ensures consistent versions aligned with Ultimaker's tested dependencies
          echo "Reordering remotes: cura-conan2 first, conancenter second"
          conan remote remove conancenter
          conan remote add conancenter https://center2.conan.io --index=1
          echo "Current remote order (cura-conan2 searched first):"
          conan remote list

      - name: Configure build strategy
        run: |
          # Force building ALL packages from source to avoid prebuilt binary dependency conflicts
          # Prebuilt binaries have baked-in dependencies that cause version conflicts
          # ARM64 has limited prebuilt binaries anyway, so build from source is standard
          echo "Will build all packages from source (--build=*) to ensure consistent dependencies"

      - name: Display Conan profile
        run: |
          conan profile show
          conan remote list

      - name: Install Cura dependencies
        run: |
          conan install . \
            --build=* \
            -c tools.system.package_manager:mode=install \
            -c tools.system.package_manager:sudo=True \
            ${{ inputs.conan_args }}
        timeout-minutes: 180  # Building everything from source takes longer

      - name: Build Cura
        run: |
          conan build .

      - name: Create Cura package
        run: |
          conan create . ${{ inputs.cura_conan_version && format('--version={0}', inputs.cura_conan_version) || '' }} \
            --build=* \
            -c tools.system.package_manager:mode=install \
            -c tools.system.package_manager:sudo=True \
            -o cura:enterprise=${{ inputs.enterprise }} \
            -o cura:staging=${{ inputs.staging }} \
            ${{ inputs.conan_args }}

      - name: Install additional dependencies for AppImage
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt install -yq \
            file libegl1 libgl1 libfontconfig1 libxrender1 \
            libxi6 libxrandr2 libxcursor1 libxinerama1 libxcb-cursor0
          python3 -m pip install --break-system-packages pyinstaller jinja2

      - name: Deploy Cura for PyInstaller
        run: |
          mkdir -p appimage_build
          cd appimage_build
          conan install --requires="cura/${{ inputs.cura_conan_version || '5.12.0-alpha.0' }}" \
            --deployer-package="*" \
            --deployer-folder=. \
            --build=* \
            -c tools.system.package_manager:mode=install \
            -c tools.system.package_manager:sudo=True

      - name: Run PyInstaller
        run: |
          cd appimage_build
          export PYTHONPATH="${PWD}/venv/lib/python3.12/site-packages:${PYTHONPATH}"
          pyinstaller UltiMaker-Cura.spec

      - name: Download appimagetool
        run: |
          cd appimage_build/dist
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-aarch64.AppImage
          chmod +x appimagetool-aarch64.AppImage

      - name: Create AppImage
        run: |
          cd appimage_build/dist
          export APPIMAGETOOL_LOCATION=./appimagetool-aarch64.AppImage
          python3 ../../packaging/AppImage/create_appimage.py \
            UltiMaker-Cura \
            "${{ inputs.cura_conan_version || '5.12.0-alpha.0' }}" \
            "UltiMaker-Cura-${{ inputs.cura_conan_version || '5.12.0-alpha.0' }}-Linux-ARM64.AppImage" || true

      - name: Verify AppImage
        run: |
          cd appimage_build/dist
          if [ -f "UltiMaker-Cura-${{ inputs.cura_conan_version || '5.12.0-alpha.0' }}-Linux-ARM64.AppImage" ]; then
            ls -lh *.AppImage | grep -v appimagetool
            echo "AppImage created successfully!"
          else
            echo "Warning: AppImage was not created"
            exit 1
          fi

      - name: Upload ARM64 package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cura-linux-arm64-package-${{ inputs.cura_conan_version || github.sha }}
          path: |
            ~/.conan2/p/*/p/
            build/
          retention-days: 7

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: UltiMaker-Cura-${{ inputs.cura_conan_version || github.sha }}-Linux-ARM64-AppImage
          path: appimage_build/dist/*.AppImage
          if-no-files-found: error
          retention-days: 30

      - name: Upload AppImage to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: appimage_build/dist/UltiMaker-Cura-*.AppImage
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
