name: Linux ARM64 Installer

on:
  push:
  workflow_dispatch:
    inputs:
      cura_conan_version:
        description: 'Cura Conan Version'
        default: ''
        type: string
      package_overrides:
        description: 'List of specific packages to be used (space-separated)'
        default: ''
        type: string
      conan_args:
        description: 'Conan args'
        default: ''
        required: false
        type: string
      enterprise:
        description: 'Build Cura as an Enterprise edition'
        default: false
        required: true
        type: boolean
      staging:
        description: 'Use staging API'
        default: false
        required: true
        type: boolean
      use_self_hosted:
        description: 'Use self-hosted ARM64 runner'
        default: false
        required: true
        type: boolean

jobs:
  linux-arm64-installer:
    runs-on: ${{ inputs.use_self_hosted && 'self-hosted-linux-arm' || 'ubuntu-24.04-arm' }}

    steps:
      - name: Checkout Cura
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt6 and system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-declarative-dev \
            qt6-tools-dev \
            libgl1-mesa-dev \
            python3 \
            python3-pip \
            python3-venv \
            git \
            wget \
            curl \
            patchelf \
            cmake \
            ninja-build \
            ccache \
            autoconf \
            automake \
            libtool

      - name: Install Conan and Python dependencies
        run: |
          pip3 install --break-system-packages "conan>=2.7.0,<3.0.0"
          # Cura's conanfile.py requires gitpython for Git()
          pip3 install --break-system-packages gitpython

      - name: Configure Conan profile for ARM64
        run: |
          conan config install https://github.com/ultimaker/conan-config.git
          conan profile detect --force

          # Create a cura-arm64 profile that extends default with cura-specific settings
          mkdir -p ~/.conan2/profiles
          cat > ~/.conan2/profiles/cura-arm64 << 'EOF'
          include(default)

          [replace_requires]
          libsystemd/*: libsystemd/[>=255.10]
          fmt/*: fmt/[>=11.0.0]
          boost/*: boost/[>=1.86.0]
          spdlog/*: spdlog/[>=1.15.0]

          [settings]
          compiler.cppstd=17
          curaengine*:compiler.cppstd=20
          curaengine_plugin_infill_generate*:compiler.cppstd=20
          curaengine_plugin_gradual_flow*:compiler.cppstd=20
          curaengine_grpc_definitions*:compiler.cppstd=20
          scripta*:compiler.cppstd=20
          umspatial*:compiler.cppstd=20
          dulcificum*:compiler.cppstd=20
          uvula*:compiler.cppstd=20
          curator/*:compiler.cppstd=20
          arcus*:compiler.cppstd=20
          pyarcus*:compiler.cppstd=20

          [options]
          asio-grpc/*:local_allocator=recycling_allocator
          grpc/*:csharp_plugin=False
          grpc/*:node_plugin=False
          grpc/*:objective_c_plugin=False
          grpc/*:php_plugin=False
          grpc/*:ruby_plugin=False
          grpc/*:python_plugin=False
          boost/*:header_only=True
          openssl/*:shared=True
          pyarcus/*:shared=True
          pysavitar/*:shared=True
          pynest2d/*:shared=True
          cpython/*:shared=True
          cpython/*:with_tkinter=False
          cpython/*:with_curses=False
          dulcificum/*:shared=True
          clipper/*:shared=True
          EOF

          echo "===== Created cura-arm64 profile ====="
          conan profile show
          echo "===== Available profiles ====="
          conan profile list
          echo "===================================="

      - name: Fix Conan 2.0 compatibility issues in cached recipes
        run: |
          # Create a wrapper script that patches AutoPackager and retries on failure
          cat > /tmp/conan-install-wrapper.sh << 'WRAPPER_EOF'
          #!/bin/bash

          patch_autopackager() {
              echo "Patching AutoPackager usage in conan cache..."
              find ~/.conan2/p -name "conanfile.py" -type f 2>/dev/null | while read filepath; do
                  if grep -q "AutoPackager" "$filepath" 2>/dev/null; then
                      echo "Patching: $filepath"
                      # Make sure file is writable
                      chmod +w "$filepath" 2>/dev/null || true
                      # Use sed for simple text replacement (more reliable than Python heredoc)
                      sed -i 's/from conan\.tools\.files import copy, AutoPackager, update_conandata/from conan.tools.files import copy, update_conandata/g' "$filepath"
                      sed -i 's/from conan\.tools\.files import copy, save, load, AutoPackager/from conan.tools.files import copy, save, load/g' "$filepath"
                      sed -i 's/from conan\.tools\.files import AutoPackager/from conan.tools.files import copy/g' "$filepath"
                      # Replace AutoPackager(self).run() with explicit copy calls
                      if grep -q "AutoPackager(self).run()" "$filepath"; then
                          sed -i '/AutoPackager(self)\.run()/r /tmp/autopackager_replacement.txt' "$filepath"
                          sed -i '/AutoPackager(self)\.run()/d' "$filepath"
                      fi
                  fi
              done
              echo "AutoPackager patching complete"
          }

          # Create the replacement text for AutoPackager(self).run()
          cat > /tmp/autopackager_replacement.txt << 'EOF'
          copy(self, pattern="*.h", dst=os.path.join(self.package_folder, "include"), keep_path=False)
          copy(self, pattern="*.a", dst=os.path.join(self.package_folder, "lib"), keep_path=False)
          copy(self, pattern="*.lib", dst=os.path.join(self.package_folder, "lib"), keep_path=False)
          copy(self, pattern="*.so*", dst=os.path.join(self.package_folder, "lib"), keep_path=False)
          copy(self, pattern="*.dylib", dst=os.path.join(self.package_folder, "lib"), keep_path=False)
          copy(self, pattern="*.dll", dst=os.path.join(self.package_folder, "bin"), keep_path=False)
          EOF

          # Retry loop for conan install
          MAX_RETRIES=10
          RETRY_COUNT=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              RETRY_COUNT=$((RETRY_COUNT + 1))
              echo "Conan install attempt $RETRY_COUNT/$MAX_RETRIES..."

              # Run conan install and capture output
              conan install "$@" 2>&1 | tee /tmp/conan-output.log
              EXIT_CODE=${PIPESTATUS[0]}

              if [ $EXIT_CODE -eq 0 ]; then
                  echo "Conan install succeeded!"
                  exit 0
              fi

              # Check if the error is related to AutoPackager
              if grep -q "AutoPackager" /tmp/conan-output.log; then
                  echo "AutoPackager error detected, patching recipes and retrying..."
                  patch_autopackager
                  sleep 1
              else
                  echo "Conan install failed with non-AutoPackager error:"
                  tail -100 /tmp/conan-output.log
                  exit $EXIT_CODE
              fi
          done

          echo "Max retries reached, giving up"
          tail -100 /tmp/conan-output.log
          exit 1
          WRAPPER_EOF

          chmod +x /tmp/conan-install-wrapper.sh
          echo "Created conan-install-wrapper.sh"

      - name: Create libnsl symlink for ARM64
        run: |
          # Some Python builds may need libnsl.so symlink
          if [ -f /lib/aarch64-linux-gnu/libnsl.so.2 ] && [ ! -L /lib/aarch64-linux-gnu/libnsl.so ]; then
            sudo ln -sf /lib/aarch64-linux-gnu/libnsl.so.2 /lib/aarch64-linux-gnu/libnsl.so
          fi

      - name: Install Cura dependencies with Conan
        run: |
          cd /home/runner/work/Cura/Cura

          # Set CONAN_LOGIN_USERNAME to skip any interactive prompts
          export CONAN_LOGIN_USERNAME=""

          # Use the wrapper script that patches AutoPackager and retries on failure
          /tmp/conan-install-wrapper.sh \
            --build=missing \
            --update \
            -o cura/*:devtools=True \
            -pr:h cura-arm64 \
            -pr:b default \
            -g VirtualPythonEnv \
            ${{ inputs.conan_args }}

      - name: Build Cura
        run: |
          cd /home/runner/work/Cura/Cura
          source venv/bin/activate

          # Verify PyQt6 is installed
          python -c "import PyQt6; print('PyQt6 installed successfully')"

          # Run any additional build steps if needed
          # python cura_app.py --version  # Quick sanity check

      - name: Create PyInstaller spec
        run: |
          cd /home/runner/work/Cura/Cura
          source venv/bin/activate

          # Run conan deploy to prepare for PyInstaller
          conan deploy . || true

          # The spec file should have been generated by conan deploy
          if [ -f "venv/conan/UltiMaker-Cura.spec" ]; then
            echo "PyInstaller spec found at venv/conan/UltiMaker-Cura.spec"
          else
            echo "Warning: PyInstaller spec not found"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cura-arm64-build
          path: |
            venv/
            dist/
          retention-days: 7
