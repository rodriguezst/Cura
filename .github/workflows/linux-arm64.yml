name: Linux ARM64 Installer
run-name: ${{ inputs.cura_conan_version }} ARM64 by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      cura_conan_version:
        description: 'Cura Conan Version'
        default: ''
        type: string
      package_overrides:
        description: 'List of specific packages to be used (space-separated)'
        default: ''
        type: string
      conan_args:
        description: 'Conan args'
        default: ''
        required: false
        type: string
      enterprise:
        description: 'Build Cura as an Enterprise edition'
        default: false
        required: true
        type: boolean
      staging:
        description: 'Use staging API'
        default: false
        required: true
        type: boolean
  push:

jobs:
  linux-installer-arm64:
    runs-on: ubuntu-24.04-arm  # Use ARM64 runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'arm64'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo DEBIAN_FRONTEND=noninteractive apt install -yq \
            python3-pip python3-venv python3-dev python3-full pipx \
            cmake git build-essential ninja-build gettext \
            qt6-base-dev qt6-declarative-dev libqt6svg6-dev \
            libgl1-mesa-dev libglu1-mesa-dev pkg-config \
            libx11-dev libxcb1-dev libxkbcommon-dev \
            python3-git python3-yaml python3-jinja2 python3-requests \
            libxcb-cursor-dev libxcb-icccm4-dev libxcb-image0-dev \
            libxcb-keysyms1-dev libxcb-randr0-dev libxcb-render-util0-dev \
            libxcb-shape0-dev libxcb-sync-dev libxcb-xfixes0-dev libxcb-xinerama0-dev \
            libnsl-dev libtirpc-dev

      - name: Install SIP, PyQt6 and setup qmake
        run: |
          python3 -m pip install --break-system-packages "sip>=6,<7"
          python3 -m pip install --break-system-packages --only-binary :all: PyQt6>=6.8.0
          sudo ln -sf /usr/bin/qmake6 /usr/bin/qmake || true

      - name: Install Conan
        run: |
          pipx install conan==2.7.1
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Inject Conan dependencies
        run: |
          pipx inject conan gitpython pyyaml jinja2 requests

      - name: Configure Conan
        run: |
          conan config install https://github.com/Ultimaker/conan-config.git#commit=2f501d5fa8e9399405cc9c7f82a692760daa3f78 -t git
          conan profile detect --force

      - name: Display Conan profile
        run: |
          conan profile show --profile:host default
          conan remote list

      - name: Install Cura dependencies
        run: |
          conan install . --build=missing \
            -c tools.system.package_manager:mode=install \
            -c tools.system.package_manager:sudo=True \
            ${{ inputs.conan_args }}
        timeout-minutes: 120  # ARM builds take longer

      - name: Build Cura
        run: |
          conan build .

      - name: Create Cura package
        run: |
          conan create . ${{ inputs.cura_conan_version && format('--version={0}', inputs.cura_conan_version) || '' }} \
            --build=missing \
            -o cura:enterprise=${{ inputs.enterprise }} \
            -o cura:staging=${{ inputs.staging }} \
            ${{ inputs.conan_args }}

      - name: Upload ARM64 package
        uses: actions/upload-artifact@v4
        with:
          name: cura-linux-arm64-${{ inputs.cura_conan_version || github.sha }}
          path: |
            ~/.conan2/p/*/p/
            build/
          retention-days: 7
