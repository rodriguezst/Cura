name: Linux ARM64 Build
run-name: ARM64 Build ${{ github.ref_name }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      cura_conan_version:
        description: 'Cura Conan Version'
        default: ''
        type: string
      conan_args:
        description: 'Additional Conan args'
        default: ''
        required: false
        type: string
  push:
    paths:
      - 'plugins/**'
      - 'cura/**'
      - 'resources/**'
      - 'conanfile.py'
      - 'conandata.yml'
      - '.github/workflows/linux-arm64.yml'
  pull_request:
    branches:
      - 'main'
    paths:
      - 'plugins/**'
      - 'cura/**'
      - 'resources/**'
      - 'conanfile.py'
      - 'conandata.yml'
      - '.github/workflows/linux-arm64.yml'

env:
  CONAN_LOGIN_USERNAME: ${{ secrets.CONAN_USER }}
  CONAN_PASSWORD: ${{ secrets.CONAN_PASS }}

jobs:
  build-arm64:
    name: Build Cura ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -yq \
            cmake ninja-build g++ python3-pip python3-dev python3-venv \
            qt6-base-dev qt6-declarative-dev qt6-tools-dev qt6-l10n-tools \
            qml6-module-qtqml qml6-module-qtqml-models qml6-module-qtquick \
            qml6-module-qtquick-controls qml6-module-qtquick-dialogs \
            qml6-module-qtquick-layouts qml6-module-qtquick-window \
            qml6-module-qtquick-templates qml6-module-qt5compat-graphicaleffects \
            libprotobuf-dev protobuf-compiler libpolyclipping-dev libnlopt-dev \
            libfmt-dev libspdlog-dev rapidjson-dev libpugixml-dev libcgal-dev \
            libassimp-dev libstb-dev librange-v3-dev lib3mf-dev libdocopt-dev \
            libtbb-dev libgrpc++-dev libssl-dev libboost-all-dev libgmp-dev \
            libmpfr-dev libopenexr-dev libdbus-1-dev pybind11-dev catch2 gettext \
            python3-numpy python3-scipy python3-shapely python3-pyclipper \
            python3-opengl python3-zeroconf python3-keyring python3-requests \
            python3-cryptography python3-serial python3-yaml python3-packaging \
            python3-pyqt6 python3-pyqt6.qtquick \
            libnsl-dev libtirpc-dev

      - name: Setup Python virtual environment
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install "conan>=2.7.0,<2.8.0"
          pip install "sip>=6,<7"
          pip install gitpython

      - name: Configure Conan
        run: |
          source .venv/bin/activate
          conan profile detect --force
          conan config install https://github.com/ultimaker/conan-config.git

          # Add ARM64-specific version overrides to existing [replace_requires] section
          # (don't create duplicate section - append to existing one)
          PROFILE=~/.conan2/profiles/cura.jinja
          if grep -q '^\[replace_requires\]' "$PROFILE"; then
            # Append entries after existing [replace_requires] section
            sed -i '/^\[replace_requires\]/a \
          # ARM64 Linux version overrides\
          spdlog/*: spdlog/1.12.0\
          fmt/*: fmt/10.2.1\
          boost/*: boost/1.86.0' "$PROFILE"
          else
            # No existing section, create new one
            cat >> "$PROFILE" << 'EOF'

          [replace_requires]
          # ARM64 Linux version overrides
          spdlog/*: spdlog/1.12.0
          fmt/*: fmt/10.2.1
          boost/*: boost/1.86.0
          EOF
          fi

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-arm64-${{ hashFiles('conanfile.py', 'conandata.yml') }}
          restore-keys: |
            conan-arm64-

      - name: Build Cura dependencies
        run: |
          source .venv/bin/activate

          # Pre-create cura_venv with system-site-packages to access system PyQt6
          # This prevents VirtualPythonEnv from trying to pip install PyQt6
          mkdir -p build/generators
          python3 -m venv --system-site-packages build/generators/cura_venv

          # Install packages that VirtualPythonEnv would install, excluding PyQt6
          source build/generators/cura_venv/bin/activate
          pip install --upgrade pip wheel setuptools

          # Now run conan - VirtualPythonEnv will reuse existing venv
          conan install . \
            --build=missing \
            --update \
            -o cura/*:devtools=True \
            -g VirtualPythonEnv \
            ${{ inputs.conan_args }} || {
              # If VirtualPythonEnv fails on PyQt6, manually install remaining deps
              echo "VirtualPythonEnv failed, manually installing pip packages..."

              # Filter out PyQt6 from requirements and install the rest
              if [ -f build/generators/pip_requirements_core_hashes.txt ]; then
                grep -v -E '^PyQt6|^PyQt6-' build/generators/pip_requirements_core_hashes.txt > /tmp/requirements_no_pyqt.txt || true
                pip install -r /tmp/requirements_no_pyqt.txt || true
              fi

              # Install other common dependencies
              pip install certifi zeroconf trimesh sentry-sdk pyserial requests shapely \
                          keyring cryptography scipy pyclipper PyYAML packaging || true
            }

          # Generate virtual_python_env.sh if it doesn't exist (fallback)
          if [ ! -f build/generators/virtual_python_env.sh ]; then
            echo "Generating virtual_python_env.sh manually..."

            # Find Conan package paths
            CONAN_PKGS="$HOME/.conan2/p"
            URANIUM_PATH=$(find "$CONAN_PKGS" -path "*/uranium*/p/site-packages" -type d 2>/dev/null | head -1)
            URANIUM_PLUGINS=$(find "$CONAN_PKGS" -path "*/uranium*/p/plugins" -type d 2>/dev/null | head -1)
            PYARCUS_PATH=$(find "$CONAN_PKGS" -path "*/pyarc*/p/lib" -type d 2>/dev/null | head -1)
            PYSAVITAR_PATH=$(find "$CONAN_PKGS" -path "*/pysav*/p/lib" -type d 2>/dev/null | head -1)
            PYNEST2D_PATH=$(find "$CONAN_PKGS" -path "*/pynes*/p/lib" -type d 2>/dev/null | head -1)
            DULCIFICUM_PATH=$(find "$CONAN_PKGS" -path "*/dulci*/p/lib/pyDulcificum" -type d 2>/dev/null | head -1)
            CURAENGINE_PATH=$(find "$CONAN_PKGS" -path "*/curaen*/p/bin" -type d 2>/dev/null | head -1)
            CURA_RESOURCES=$(find "$CONAN_PKGS" -path "*/cura_resources*/p/res" -type d 2>/dev/null | head -1)

            VENV_SITE="$(pwd)/build/generators/cura_venv/lib/python3.12/site-packages"

            cat > build/generators/virtual_python_env.sh << ENVEOF
            #!/bin/bash
            # Auto-generated virtual_python_env.sh for ARM64 build
            
            export PYTHONPATH="${VENV_SITE}:${URANIUM_PATH}:${URANIUM_PLUGINS}:${PYARCUS_PATH}:${PYSAVITAR_PATH}:${PYNEST2D_PATH}:${DULCIFICUM_PATH}:\${PYTHONPATH}"
            export PATH="${CURAENGINE_PATH}:\${PATH}"
            export CURA_RESOURCES="${CURA_RESOURCES}"
            export CURA_ENGINE_SEARCH_PATH="${CURA_RESOURCES}/extruders"
            export VIRTUAL_ENV="$(pwd)/build/generators/cura_venv"
            export QT_QPA_PLATFORM="\${QT_QPA_PLATFORM:-offscreen}"
            unset PYTHONHOME
            ENVEOF
            chmod +x build/generators/virtual_python_env.sh
          fi
        timeout-minutes: 300

      - name: Setup Python environment
        run: |
          # Ensure system PyQt6 is accessible in venv
          VENV_SITE=$(find build/generators/cura_venv -name site-packages -type d | head -1)

          # Verify PyQt6 works
          source build/generators/cura_venv/bin/activate
          python -c "from PyQt6.QtCore import QT_VERSION_STR; print(f'PyQt6 Qt: {QT_VERSION_STR}')" || {
            echo "PyQt6 not found, linking from system..."
            SYS_SITE=$(python3 -c "import site; print(site.getsitepackages()[0])")
            ln -sf "$SYS_SITE/PyQt6" "$VENV_SITE/" 2>/dev/null || true
            ln -sf "$SYS_SITE/PyQt6_sip"* "$VENV_SITE/" 2>/dev/null || true
            ln -sf "$SYS_SITE/sipbuild"* "$VENV_SITE/" 2>/dev/null || true
          }

          # Generate CuraVersion.py
          cat > cura/CuraVersion.py << 'PYEOF'
          # Auto-generated for ARM64 build
          CuraAppName = "cura"
          CuraAppDisplayName = "UltiMaker Cura"
          CuraVersion = "5.12.0-alpha.0"
          CuraVersionFull = "5.12.0-alpha.0"
          CuraBuildType = ""
          CuraDebugMode = False
          CuraCloudAPIRoot = "https://api.ultimaker.com"
          CuraCloudAPIVersion = "1"
          CuraCloudAccountAPIRoot = "https://account.ultimaker.com"
          CuraMarketplaceRoot = "https://marketplace.ultimaker.com"
          CuraDigitalFactoryURL = "https://digitalfactory.ultimaker.com"
          CuraLatestURL = "https://software.ultimaker.com/latest.json"
          ConanInstalls = {}
          PythonInstalls = {}
          DependenciesDescriptions = {}
          PYEOF

      - name: Test Cura imports
        run: |
          source build/generators/virtual_python_env.sh

          # Test imports
          python -c "from PyQt6.QtCore import QT_VERSION_STR; print(f'PyQt6 Qt: {QT_VERSION_STR}')"
          python -c "import UM; print('Uranium imported successfully')"
          python -c "import cura; print('Cura imported successfully')"
          python -c "from cura.CuraApplication import CuraApplication; print('CuraApplication imported')"

          # Test CuraEngine
          which CuraEngine && CuraEngine help

      - name: Run unit tests
        run: |
          source build/generators/virtual_python_env.sh
          QT_QPA_PLATFORM=offscreen pytest tests/ -v --tb=short || echo "Some tests may fail on ARM64"
        continue-on-error: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cura-arm64-build
          path: |
            build/generators/cura_venv/
            build/generators/virtual_python_env.sh
            cura/CuraVersion.py
            !**/*.pyc
            !**/__pycache__
          retention-days: 7

