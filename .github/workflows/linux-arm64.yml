name: Linux ARM64 Build

run-name: ARM64 build by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      enterprise:
        description: 'Build Cura as an Enterprise edition'
        default: false
        required: true
        type: boolean
      staging:
        description: 'Use staging API'
        default: false
        required: true
        type: boolean
  push:
    paths:
      - 'cura/**'
      - 'plugins/**'
      - 'resources/**'
      - 'conanfile.py'
      - 'conandata.yml'
      - '.github/workflows/linux-arm64.yml'
  pull_request:
    branches:
      - main
      - '[0-9]+.[0-9]+'
    paths:
      - 'cura/**'
      - 'plugins/**'
      - 'resources/**'
      - 'conanfile.py'
      - 'conandata.yml'
      - '.github/workflows/linux-arm64.yml'

jobs:
  linux-arm64:
    name: Build Cura for Linux ARM64
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout Cura repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -yq \
            build-essential cmake ninja-build pkg-config \
            qt6-base-dev qt6-base-dev-tools qt6-tools-dev qt6-declarative-dev \
            qt6-l10n-tools libqt6svg6-dev libqt6charts6-dev \
            protobuf-compiler libprotobuf-dev libprotoc-dev python3-protobuf \
            libpugixml-dev libpython3-dev python3-pynest2d \
            python3-venv python3-pip python3-sip \
            xvfb libxkbcommon-x11-0 libxcb-cursor0 \
            git

      - name: Set up Python virtual environment
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip

      - name: Create build directory for dependencies
        run: |
          mkdir -p ~/cura-build

      - name: Clone Uranium
        run: |
          cd ~/cura-build
          git clone https://github.com/Ultimaker/Uranium.git

      - name: Clone CuraEngine
        run: |
          cd ~/cura-build
          git clone https://github.com/Ultimaker/CuraEngine.git

      - name: Install Conan for CuraEngine dependencies
        run: |
          pip install conan==2.7.1
          conan profile detect --force

      - name: Install CuraEngine Conan dependencies
        run: |
          cd ~/cura-build/CuraEngine
          # Patch conanfile.py to remove private sentrylibrary dependency
          sed -i "s/python_requires = \"sentrylibrary\/1.0.0\"/# python_requires = \"sentrylibrary\/1.0.0\"/" conanfile.py
          # Also disable Sentry in conanfile.py
          sed -i 's/options\["sentry"\].*=.*/options["sentry"] = [False, "Use Sentry crash reporting"]/' conanfile.py || true
          conan install . --build=missing --update -s compiler.libcxx=libstdc++11 -o sentry=False

      - name: Patch CuraEngine CMakeLists.txt
        run: |
          cd ~/cura-build/CuraEngine
          # Patch: Remove standardprojectsettings dependency
          sed -i 's/find_package(standardprojectsettings REQUIRED)/# find_package(standardprojectsettings REQUIRED)/' CMakeLists.txt
          sed -i 's/AssureOutOfSourceBuilds()/# AssureOutOfSourceBuilds()/' CMakeLists.txt
          # Also patch conanfile.cmake to use Protobuf instead of protobuf
          sed -i 's/find_package(protobuf REQUIRED)/find_package(Protobuf REQUIRED)/' conanfile.cmake || true

      - name: Build CuraEngine
        run: |
          cd ~/cura-build/CuraEngine
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DENABLE_ARCUS=OFF -DENABLE_PLUGINS=OFF
          make -j$(nproc)

      - name: Clone fdm_materials
        run: |
          cd ~/cura-build
          git clone https://github.com/Ultimaker/fdm_materials.git

      - name: Clone cura-binary-data
        run: |
          cd ~/cura-build
          git clone https://github.com/Ultimaker/cura-binary-data.git

      - name: Clone libArcus
        run: |
          cd ~/cura-build
          git clone https://github.com/Ultimaker/libArcus.git

      - name: Clone libSavitar
        run: |
          cd ~/cura-build
          git clone https://github.com/Ultimaker/libSavitar.git

      - name: Clone libCharon
        run: |
          cd ~/cura-build
          git clone https://github.com/Ultimaker/libCharon.git

      - name: Patch libArcus CMakeLists.txt
        run: |
          cd ~/cura-build/libArcus
          # Create patched CMakeLists.txt
          cat > CMakeLists.txt.patched << 'EOF'
          cmake_policy(SET CMP0091 NEW)
          cmake_minimum_required(VERSION 3.23)
          project(libarcus)

          find_package(Protobuf REQUIRED)

          option(ENABLE_SENTRY "Send crash data via Sentry" OFF)

          set(arcus_SRCS
              src/Socket.cpp
              src/SocketListener.cpp
              src/MessageTypeStore.cpp
              src/PlatformSocket.cpp
              src/Error.cpp
          )

          if(BUILD_SHARED_LIBS)
              add_library(Arcus SHARED ${arcus_SRCS})
          else()
              add_library(Arcus STATIC ${arcus_SRCS})
          endif()

          target_compile_options(Arcus PUBLIC -Wall -Wextra -Wpedantic)
          find_package(Threads REQUIRED)
          target_link_libraries(Arcus PUBLIC Threads::Threads)

          target_include_directories(Arcus
                  PUBLIC
                      $<BUILD_INTERFACE:${CMAKE_CURRENT_SOURCE_DIR}/include>
                      $<INSTALL_INTERFACE:${CMAKE_INSTALL_INCLUDEDIR}>
                  PRIVATE
                      $<BUILD_INTERFACE:${CMAKE_CURRENT_SOURCE_DIR}/src>
          )
          target_link_libraries(Arcus PUBLIC ${Protobuf_LIBRARIES})
          target_include_directories(Arcus PRIVATE ${Protobuf_INCLUDE_DIRS})

          if(WIN32)
              target_compile_definitions(Arcus PRIVATE -D_WIN32_WINNT=0x0600)
              target_link_libraries(Arcus PUBLIC Ws2_32)
              set_target_properties(Arcus PROPERTIES WINDOWS_EXPORT_ALL_SYMBOLS ON)
              if (ENABLE_SENTRY)
                  set_target_properties(Arcus PROPERTIES LINK_FLAGS "/DEBUG:FULL")
              endif()
          endif()

          include(GNUInstallDirs)
          install(TARGETS Arcus
              LIBRARY DESTINATION ${CMAKE_INSTALL_LIBDIR}
              ARCHIVE DESTINATION ${CMAKE_INSTALL_LIBDIR}
              RUNTIME DESTINATION ${CMAKE_INSTALL_BINDIR}
          )
          install(DIRECTORY include/ DESTINATION ${CMAKE_INSTALL_INCLUDEDIR})
          EOF
          mv CMakeLists.txt.patched CMakeLists.txt

      - name: Build and install libArcus
        run: |
          cd ~/cura-build/libArcus
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)
          sudo make install

      - name: Build CuraEngine
        run: |
          cd ~/cura-build/CuraEngine
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)

      - name: Patch libSavitar CMakeLists.txt
        run: |
          cd ~/cura-build/libSavitar
          # Create patched CMakeLists.txt
          cat > CMakeLists.txt.patched << 'EOF'
          cmake_policy(SET CMP0091 NEW)
          cmake_minimum_required(VERSION 3.20)
          project(libsavitar)

          find_package(pugixml REQUIRED)

          set(savitar_SRCS
                  src/Namespace.cpp
                  src/ThreeMFParser.cpp
                  src/SceneNode.cpp
                  src/Scene.cpp
                  src/MeshData.cpp
                  src/Vertex.cpp
                  src/Face.cpp
                  src/UVCoordinate.cpp
                  src/UVCoordinatesIndices.cpp
                  src/TextureData.cpp
          )

          if (BUILD_SHARED_LIBS)
              add_library(Savitar SHARED ${savitar_SRCS})
              if (WIN32)
                  set_target_properties(Savitar PROPERTIES WINDOWS_EXPORT_ALL_SYMBOLS ON)
              endif ()
          else ()
              add_library(Savitar STATIC ${savitar_SRCS})
          endif ()

          target_compile_options(Savitar PUBLIC -Wall -Wextra -Wpedantic)
          target_link_libraries(Savitar PUBLIC pugixml::pugixml)

          target_include_directories(Savitar
                  PUBLIC
                  $<BUILD_INTERFACE:${CMAKE_CURRENT_SOURCE_DIR}/include>
                  $<INSTALL_INTERFACE:${CMAKE_INSTALL_INCLUDEDIR}>
                  PRIVATE
                  $<BUILD_INTERFACE:${CMAKE_CURRENT_SOURCE_DIR}/src>
          )

          include(GNUInstallDirs)
          install(TARGETS Savitar
              LIBRARY DESTINATION ${CMAKE_INSTALL_LIBDIR}
              ARCHIVE DESTINATION ${CMAKE_INSTALL_LIBDIR}
              RUNTIME DESTINATION ${CMAKE_INSTALL_BINDIR}
          )
          install(DIRECTORY include/ DESTINATION ${CMAKE_INSTALL_INCLUDEDIR})
          EOF
          mv CMakeLists.txt.patched CMakeLists.txt

      - name: Build and install libSavitar
        run: |
          cd ~/cura-build/libSavitar
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)
          sudo make install

      - name: Build and install libCharon
        run: |
          cd ~/cura-build/libCharon
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          sudo make install

      - name: Build pyArcus (Python bindings)
        run: |
          cd ~/cura-build/libArcus
          mkdir -p pyArcus
          # Copy SIP files and source for Python bindings
          cp -r python/* pyArcus/ || true
          # Install sip-build from pip (more reliable than apt)
          pip install 'sip>=6,<7'
          # Create pyproject.toml for SIP build
          cat > pyArcus/pyproject.toml << 'EOF'
          [build-system]
          requires = ["sip >=6, <7"]
          build-backend = "sipbuild.api"

          [project]
          name = "pyArcus"
          version = "6.0.0"

          [tool.sip.bindings.project]
          name = "Arcus"
          EOF
          # Copy sip files from python directory
          find . -name "*.sip" -exec cp {} pyArcus/ \; 2>/dev/null || true
          # Build with sip
          cd pyArcus
          sip-build --build-type lib
          cd build
          make
          sudo make install

      - name: Install Python dependencies
        run: |
          source venv/bin/activate
          pip install numpy scipy numpy-stl pyclipper networkx \
              colorlog cryptography keyring python-utils \
              typing_extensions six PyQt6-WebEngine PyQt6-Qt6

      - name: Create stub pyUvula module
        run: |
          source venv/bin/activate
          mkdir -p $(python3 -c "import site; print(site.getsitepackages()[0])")/pyUvula
          cat > $(python3 -c "import site; print(site.getsitepackages()[0])")/pyUvula/__init__.py << 'EOF'
          # Stub for pyUvula - private Ultimaker UV unwrapping library
          # This provides a minimal interface to prevent import errors
          EOF

      - name: Set up environment
        run: |
          echo "PYTHONPATH=$HOME/cura-build/Uranium:$PYTHONPATH" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Create CuraVersion.py
        run: |
          cd $GITHUB_WORKSPACE
          cat > cura/CuraVersion.py << 'EOF'
          # Auto-generated for ARM64 build
          cura_app_name = "UltiMaker Cura"
          cura_version = "5.12.0"
          cura_version_full = "5.12.0+arm64"
          cura_build_type = ""
          cura_debug_mode = False
          cura_cloud_api_root = "https://api.ultimaker.com"
          cura_cloud_api_version = "1"
          cura_cloud_account_api_root = "https://account.ultimaker.com"
          cura_marketplace_root = "https://marketplace.ultimaker.com"
          cura_digital_factory_url = "https://digitalfactory.ultimaker.com"
          cura_latest_url = "https://github.com/Ultimaker/Cura/releases"
          EOF

      - name: Copy CuraEngine to Cura directory
        run: |
          cp ~/cura-build/CuraEngine/build/Release/CuraEngine $GITHUB_WORKSPACE/

      - name: Create resources symbolic links
        run: |
          mkdir -p $GITHUB_WORKSPACE/resources/materials
          ln -sf ~/cura-build/fdm_materials/* $GITHUB_WORKSPACE/resources/materials/ 2>/dev/null || true

      - name: Test Cura launch (headless with xvfb)
        run: |
          source venv/bin/activate
          cd $GITHUB_WORKSPACE
          export PYTHONPATH=$HOME/cura-build/Uranium:$PYTHONPATH
          export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH
          # Test import of main modules
          python3 -c "
          import sys
          print('Python:', sys.version)
          print('Python executable:', sys.executable)
          import PyQt6
          print('PyQt6 version:', PyQt6.QtCore.PYQT_VERSION_STR)
          print('Qt version:', PyQt6.QtCore.QT_VERSION_STR)
          import numpy
          print('NumPy version:', numpy.__version__)
          print('All imports successful!')
          "
          # Test Cura imports
          python3 -c "
          import sys
          sys.path.insert(0, '$HOME/cura-build/Uranium')
          from cura import CuraVersion
          print('Cura Version:', CuraVersion.cura_version)
          print('Cura imports successful!')
          "
          # Try launching Cura (will fail at GUI but proves core works)
          xvfb-run -a python3 cura_app.py --help || true

      - name: Create distribution package
        run: |
          mkdir -p cura-arm64-package
          cp -r $GITHUB_WORKSPACE/cura cura-arm64-package/
          cp -r $GITHUB_WORKSPACE/plugins cura-arm64-package/
          cp -r $GITHUB_WORKSPACE/resources cura-arm64-package/
          cp -r $GITHUB_WORKSPACE/icons cura-arm64-package/
          cp $GITHUB_WORKSPACE/cura_app.py cura-arm64-package/
          cp $GITHUB_WORKSPACE/CuraEngine cura-arm64-package/
          cp -r $HOME/cura-build/Uranium cura-arm64-package/
          cp -r ~/cura-build/fdm_materials cura-arm64-package/
          cp -r ~/cura-build/cura-binary-data cura-arm64-package/

          # Create launcher script
          cat > cura-arm64-package/cura.sh << 'EOF'
          #!/bin/bash
          SCRIPT_DIR="$( cd "$( dirname "${BASH_SOURCE[0]}" )" && pwd )"
          export PYTHONPATH="$SCRIPT_DIR/Uranium:$PYTHONPATH"
          export LD_LIBRARY_PATH="/usr/local/lib:$LD_LIBRARY_PATH"
          cd "$SCRIPT_DIR"
          python3 cura_app.py "$@"
          EOF
          chmod +x cura-arm64-package/cura.sh

          # Create tarball
          tar -czf cura-arm64-linux.tar.gz -C cura-arm64-package .

      - name: Upload ARM64 build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cura-arm64-linux
          path: cura-arm64-linux.tar.gz
          retention-days: 30

      - name: Upload build summary
        run: |
          echo "## ARM64 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Python**: $(python3 --version)" >> $GITHUB_STEP_SUMMARY
          echo "- **Qt**: $(pkg-config --modversion Qt6Core 2>/dev/null || echo 'Not found')" >> $GITHUB_STEP_SUMMARY
          echo "- **Protobuf**: $(protoc --version | cut -d' ' -f2)" >> $GITHUB_STEP_SUMMARY
          echo "- **libArcus**: Installed to /usr/local/lib" >> $GITHUB_STEP_SUMMARY
          echo "- **libSavitar**: Installed to /usr/local/lib" >> $GITHUB_STEP_SUMMARY
          echo "- **CuraEngine**: Built at ~/cura-build/CuraEngine/build/Release/" >> $GITHUB_STEP_SUMMARY
          echo "- **libCharon**: Installed to /usr/local/lib/python*" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Package Contents" >> $GITHUB_STEP_SUMMARY
          tar -tzf cura-arm64-linux.tar.gz | head -20 >> $GITHUB_STEP_SUMMARY
